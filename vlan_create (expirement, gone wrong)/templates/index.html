<!DOCTYPE html>
<html>
<head>
    <title>VLAN Creator</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 250px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #16a34a;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>VLAN Creator</h1>

    <input id="vlan_id" placeholder="VLAN ID"><br>
    <input id="vlan_name" placeholder="VLAN Name"><br>

    <button onclick="createVLAN()">Create VLAN</button>

    <div id="status"></div>

    <script>
async function createVLAN() {
    const vlan_id = document.getElementById("vlan_id").value;
    const vlan_name = document.getElementById("vlan_name").value;

    const status = document.getElementById("status");
    status.innerText = "⏳ Creating VLAN...";

    try {
        const response = await fetch("/create-vlan", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                vlan_id,
                vlan_name
            })
        });

        const result = await response.json();

        if (result.status === "success") {
            status.innerHTML = `
                ✅ VLAN CREATED<br><br>
                VLAN ID: <b>${result.vlan_id}</b><br>
                Name: <b>${result.vlan_name}</b><br>
                IP Pool: <b>${result.ip_pool}</b>
            `;
            status.style.color = "lightgreen";
        } else {
            status.innerText = "❌ Error: " + result.message;
            status.style.color = "red";
        }

    } catch (error) {
        status.innerText = "❌ Connection error";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
